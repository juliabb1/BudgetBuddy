version: '1'
services:
  db:
    image: postgres:16-alpine
    container_name: finanzguru_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finanzguru
    volumes:
      - db_data:/var/lib/postgresql/data
    ports: ['5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d finanzguru']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: always
    container_name: finanzguru_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/finanzguru
      JWT_SECRET: supersecret_change_me
      JWT_EXPIRES_IN: 7d
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports: ['3001:3001']

  web:
    container_name: finanzguru_web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
      NEXTAUTH_SECRET: supersecret_change_me
    depends_on:
      - backend
    ports: ['3000:3000']

volumes:
  db_data:
