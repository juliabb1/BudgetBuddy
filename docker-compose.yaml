version: "1"
services:
  db:
    image: postgres:16-alpine
    container_name: finanzguru_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finanzguru
    volumes:
      - db_data:/var/lib/postgresql/data
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finanzguru"]
      interval: 5s
      timeout: 3s
      retries: 10

